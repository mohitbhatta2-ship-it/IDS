# Render blueprint — https://render.com/docs/blueprint-spec
#
# In Render: New → Blueprint → connect this repo. Everything below is applied
# automatically; the only manual step is confirming the free plan.
services:
  - type: web
    name: nids-ids2018
    runtime: python
    plan: free
    rootDir: webapp_django
    buildCommand: ./build.sh
    startCommand: gunicorn ids_web.wsgi:application --workers 2 --timeout 120
    healthCheckPath: /
    envVars:
      # Generated by Render and never shown in the repo.
      - key: IDS_SECRET_KEY
        generateValue: true

      - key: IDS_DEBUG
        value: "0"

      # Render terminates TLS, so the SSL redirect and secure cookies are safe.
      - key: IDS_SECURE
        value: "1"

      # scikit-learn 1.9.0 / xgboost 3.3.0 wheels are published for this line.
      # The saved models must be unpickled by the same scikit-learn version
      # they were written with, so do not float these.
      - key: PYTHON_VERSION
        value: "3.12.7"

      # ALLOWED_HOSTS and CSRF_TRUSTED_ORIGINS pick up RENDER_EXTERNAL_HOSTNAME
      # automatically (see ids_web/settings.py), so no hostname is hardcoded.

      # Prediction history is appended to logs/predictions.jsonl, which the free
      # plan's ephemeral filesystem wipes on every deploy. On a paid plan, add a
      # persistent disk and point the log at it so history survives:
      #
      #   disks:
      #     - name: history
      #       mountPath: /var/data
      #       sizeGB: 1
      #
      # - key: IDS_HISTORY_LOG
      #   value: /var/data/predictions.jsonl
